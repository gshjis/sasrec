[project]
name = "informatica"
version = "0.1.0"
description = ""
authors = [
    {name = "gshjis",email = "ilya.togan@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "polars (>=2.1.0,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "huggingface-hub (>=2.4.0,<3.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)"
]

[tool.poetry]
packages = [
    {include = "models", from = "src"},
    {include = "data_preprocessing", from = "src"},
    {include = "data_extractor", from = "src"},
    {include = "paths", from = "src"},
    {include = "config", from = "src"},
    {include = "run_meta", from = "src"},
    {include = "checkpoint", from = "src"},
]

[tool.pyright]
# PyTorch 2.x uses dynamic C extensions without complete type stubs,
# so reportAttributeAccessIssue produces false positives on torch.*
reportAttributeAccessIssue = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "ruff (>=0.14.0,<1.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pyright (>=1.1.400,<2.0.0)",
]
